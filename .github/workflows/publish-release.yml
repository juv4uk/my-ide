name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # ==================== DESKTOP ====================
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-apple-darwin
            x86_64-apple-darwin

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config

      - name: Install frontend dependencies
        run: npm ci

      - name: Read release notes
        id: release_notes
        shell: bash
        run: |
          NOTES_PATH=".github/release-notes/${GITHUB_REF_NAME}.md"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            if [ -f "$NOTES_PATH" ]; then
              cat "$NOTES_PATH"
            else
              echo 'Release notes are generated automatically from the changes included in this version.'
              echo
              echo 'Нотатки до релізу автоматично сформовано зі змін, що увійшли до цієї версії.'
              echo
              echo 'Die Versionshinweise werden automatisch aus den in dieser Version enthaltenen Änderungen erstellt.'
            fi
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish desktop
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Signal & Radio Log ${{ github.ref_name }}'
          releaseBody: ${{ steps.release_notes.outputs.body }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ==================== ARM LINUX (Raspberry Pi) ====================
  build-arm-linux:
    needs: build-desktop
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (ARM64 native)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config \
            xdg-utils \
            libfuse2

      - name: Install frontend dependencies
        run: npm ci

      - name: Build ARM Linux
        run: npx tauri build

      - name: Collect ARM64 artifacts
        run: |
          mkdir -p arm64-artifacts
          cp src-tauri/target/release/bundle/deb/*.deb arm64-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/appimage/*.AppImage arm64-artifacts/ 2>/dev/null || true
          cp src-tauri/target/release/bundle/rpm/*.rpm arm64-artifacts/ 2>/dev/null || true
          ls -la arm64-artifacts/

      - name: Upload ARM Linux to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          for f in arm64-artifacts/*; do
            [ -f "$f" ] && gh release upload "${{ github.ref_name }}" "$f" --clobber
          done

  # ==================== FLATPAK ====================
  build-flatpak:
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf \
            pkg-config \
            flatpak \
            flatpak-builder

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app (deb)
        run: npx tauri build

      - name: Setup Flatpak runtime
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y flathub org.freedesktop.Platform//23.08 org.freedesktop.Sdk//23.08

      - name: Build Flatpak
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DEB_FILE=$(find src-tauri/target/release/bundle/deb -name "*.deb" | head -n 1)
          cp "$DEB_FILE" ./my-ide.deb
          mkdir -p flatpak-build

          cat > com.juv4uk.my-ide.yml <<'EOF'
          app-id: com.juv4uk.my-ide
          runtime: org.freedesktop.Platform
          runtime-version: '23.08'
          sdk: org.freedesktop.Sdk
          command: my-ide
          finish-args:
            - --socket=wayland
            - --socket=fallback-x11
            - --share=ipc
            - --share=network
            - --filesystem=home
            - --device=dri
            - --talk-name=org.freedesktop.Notifications
          modules:
            - name: my-ide
              buildsystem: simple
              build-commands:
                - ar x my-ide.deb
                - tar -xf data.tar.*
                - install -D usr/bin/my-ide /app/bin/my-ide
                - cp -r usr/share /app/share
              sources:
                - type: file
                  path: my-ide.deb
          EOF

          flatpak-builder --repo=repo --force-clean flatpak-build com.juv4uk.my-ide.yml
          flatpak build-bundle repo "my-ide_${VERSION}_x86_64.flatpak" com.juv4uk.my-ide

      - name: Upload Flatpak to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          FLATPAK_PATH="my-ide_${VERSION}_x86_64.flatpak"
          test -f "$FLATPAK_PATH"
          gh release upload "${{ github.ref_name }}" "$FLATPAK_PATH" --clobber

  # ==================== WEB / WASM (ВИПРАВЛЕНО) ====================
  build-web:
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable single-file Web version
        env:
          BUILD_TARGET: web
        run: |
          npm run build

      - name: Verify build output
        run: |
          echo "=== Contents of build/ ==="
          ls -la build/ || ls -la dist/ || (echo "No build output found!" && exit 1)

      - name: Create standalone Web HTML
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -d "build" ]; then
            BUILD_DIR="build"
          elif [ -d "dist" ]; then
            BUILD_DIR="dist"
          else
            echo "ERROR: No build or dist directory found"
            exit 1
          fi

          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "ERROR: index.html not found in build output"
            exit 1
          fi
          node scripts/make-portable-web.mjs \
            "$BUILD_DIR/index.html" \
            "my-ide_${VERSION}_web.html"

      - name: Upload Web to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          WEB_PATH="my-ide_${VERSION}_web.html"
          test -f "$WEB_PATH"
          gh release upload "${{ github.ref_name }}" "$WEB_PATH" --clobber

  # ==================== ANDROID ====================
  build-android:
    needs: build-desktop
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK and NDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ -z "$SDK_ROOT" ]; then
            echo "Android SDK is not set" >&2
            exit 1
          fi

          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Android cmdline-tools not found" >&2
            exit 1
          fi

          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null || true
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "NDK_HOME=$SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euxo pipefail
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 secret is required" >&2
            exit 1
          fi
          KEYSTORE_DIR="$GITHUB_WORKSPACE/src-tauri/gen/android/app"
          mkdir -p "$KEYSTORE_DIR"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_DIR/my-ide-release.keystore"

      - name: Prepare signing config
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euxo pipefail
          if [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ]; then
            echo "Missing Android signing secrets" >&2
            exit 1
          fi
          cat > "$GITHUB_WORKSPACE/src-tauri/gen/android/app/keystore.properties" <<EOF
          storeFile=./my-ide-release.keystore
          storePassword=${ANDROID_KEYSTORE_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          keyPassword=${ANDROID_KEY_PASSWORD}
          EOF

          # EN: Validate the secret-backed keystore and alias without printing private data.
          # UK: Перевірити сховище й alias із secrets без виведення приватних даних.
          # DE: Keystore und Alias aus Secrets prüfen, ohne private Daten auszugeben.
          keytool -list \
            -keystore "$GITHUB_WORKSPACE/src-tauri/gen/android/app/my-ide-release.keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --target aarch64

      - name: Verify and upload signed Android packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APK_PATH="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          AAB_PATH="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' | head -n 1)"
          if [ -z "$APK_PATH" ] || [ -z "$AAB_PATH" ]; then
            echo "Signed APK or AAB was not produced" >&2
            exit 1
          fi

          # apksigner verifies the APK signature; jarsigner verifies the signed AAB container.
          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"
          jarsigner -verify "$AAB_PATH" >/dev/null

          RELEASE_APK="my-ide_${VERSION}_android-aarch64.apk"
          RELEASE_AAB="my-ide_${VERSION}_android-aarch64.aab"
          cp "$APK_PATH" "$RELEASE_APK"
          cp "$AAB_PATH" "$RELEASE_AAB"
          gh release upload "${{ github.ref_name }}" "$RELEASE_APK" "$RELEASE_AAB" --clobber

  # ==================== iOS (ВИПРАВЛЕНО) ====================
  build-ios:
    needs: build-desktop
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.6.0'

      - name: Install frontend dependencies
        run: npm ci

      - name: Init iOS project
        run: npx tauri ios init --ci

      # EN: Tauri generates an Xcode project here, not a standalone Swift package.
      # UK: Tauri створює тут Xcode-проєкт, а не окремий Swift-пакет.
      # DE: Tauri erzeugt hier ein Xcode-Projekt und kein eigenständiges Swift-Paket.
      - name: Clear stale SwiftPM cache | Очистити кеш SwiftPM | SwiftPM-Cache leeren
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm/repositories/swift-rs-*

      - name: Build iOS app (Simulator)
        run: npx tauri ios build --target aarch64-sim

      - name: Upload iOS to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          APP_PATH="$(find src-tauri/gen/apple -name '*.app' -type d | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi
          echo "Found app at: $APP_PATH"
          ZIP_PATH="$RUNNER_TEMP/my-ide_${VERSION}_ios-simulator-aarch64.zip"
          ditto -c -k --sequesterRsrc "$APP_PATH" "$ZIP_PATH"
          gh release upload "${{ github.ref_name }}" "$ZIP_PATH" --clobber
