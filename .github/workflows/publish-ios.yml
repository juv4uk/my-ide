name: Publish iOS Debug Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (Simulator)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim, aarch64-apple-ios

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.2.app/Contents/Developer

      - name: Install frontend dependencies
        run: npm ci

      - name: Build iOS app (Simulator)
        run: |
          rustup target add aarch64-apple-ios-sim
          npx tauri ios build --target aarch64-apple-ios-sim

      - name: Find iOS .app bundle
        id: find_app
        run: |
          APP_PATH="$(find src-tauri/gen/ios/build -type d -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app bundle found" >&2
            exit 1
          fi
          # Створюємо zip для зручності завантаження
          ZIP_PATH="${APP_PATH%.app}.zip"
          ditto -c -k --sequesterRsrc "$APP_PATH" "$ZIP_PATH"
          echo "app_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.find_app.outputs.app_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}