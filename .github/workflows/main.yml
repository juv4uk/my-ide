name: 'Publish Multiplatform Release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- DESKTOP TARGETS ---
          - platform: 'windows-latest'
            target: 'desktop'
            args: ''

          # Linux: Ubuntu 22.04 LTS
          - platform: 'ubuntu-22.04'
            target: 'desktop'
            args: ''

          # Linux: Ubuntu 24.04 LTS
          - platform: 'ubuntu-24.04'
            target: 'desktop'
            args: ''

          # macOS Universal (Intel + Apple Silicon)
          - platform: 'macos-latest'
            target: 'desktop'
            args: '--target universal-apple-darwin'

          # --- MOBILE TARGETS ---
          # Android APK
          - platform: 'ubuntu-22.04'
            target: 'android'
            args: '--target aarch64-linux-android'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '') }}

      - name: Setup Java JDK (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # Залежності для Ubuntu (і для 22.04, і для 24.04)
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu') && matrix.target == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v0.2.0
          releaseName: 'Signal & Radio IDE v0.2.0'
          releaseBody: 'Автоматичний реліз для Windows, Linux (Ubuntu 22.04/24.04), macOS та Android.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}