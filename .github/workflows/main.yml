name: 'Publish Multiplatform Release'

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- DESKTOP TARGETS ---
          - platform: 'windows-latest'
            target: 'desktop'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'desktop'
            args: ''
          - platform: 'ubuntu-24.04'
            target: 'desktop'
            args: ''
          - platform: 'macos-latest'
            target: 'desktop'
            args: '--target universal-apple-darwin'

          # --- MOBILE TARGET (ANDROID) ---
          - platform: 'ubuntu-22.04'
            target: 'android'
            args: '--target aarch64'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '') }}

      # --- Android Setup ---
      - name: Setup Java JDK (Android only)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK (Android only)
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK (Android only)
        if: matrix.target == 'android'
        shell: bash
        run: |
          set -euxo pipefail
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # --- Linux Dependencies ---
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu') && matrix.target == 'desktop'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # --- Desktop Build & Release ---
      - name: Build and Publish Tauri Desktop App
        if: matrix.target == 'desktop'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Signal & Radio IDE v__VERSION__'
          releaseBody: 'Офіційний реліз для Windows, Linux та macOS.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # --- Android Build & Release ---
      - name: Build Android APK
        if: matrix.target == 'android'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          NDK_HOME: ${{ env.NDK_HOME }}
        run: npx tauri android build --target aarch64

      - name: Find Android APK
        if: matrix.target == 'android'
        id: find_apk
        shell: bash
        run: |
          set -euxo pipefail
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' | head -n 1)
          if [[ -z "$APK_PATH" ]]; then
            echo "No APK found in src-tauri/gen/android/app/build/outputs/apk" >&2
            exit 1
          fi
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload Android APK to Release
        if: matrix.target == 'android'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || 'v0.2.0' }}
          files: ${{ steps.find_apk.outputs.apk_path }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}