name: 'Publish Multiplatform Release (Desktop & Mobile)'

on:
  push:
    tags:
      - 'v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- DESKTOP ---
          - platform: 'windows-latest'
            target: 'desktop'
            args: ''
          - platform: 'ubuntu-22.04'
            target: 'desktop'
            args: ''
          - platform: 'macos-latest'
            target: 'desktop'
            args: '--target universal-apple-darwin'

          # --- MOBILE ---
          - platform: 'ubuntu-22.04'
            target: 'android'
            args: '--target aarch64-linux-android'
          - platform: 'macos-latest'
            target: 'ios'
            args: '--target aarch64-apple-ios'

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'android' && 'aarch64-linux-android' || (matrix.target == 'ios' && 'aarch64-apple-ios' || (matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '')) }}

      # Налаштування Java та Android SDK для збірки Android APK
      - name: Setup Java JDK (for Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android NDK
        if: matrix.target == 'android'
        uses: nvida/setup-android-ndk@v1
        with:
          ndk-version: r25c

      # Залежності Linux для Tauri
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      # Ініціалізація мобільних точок входу, якщо це збірка під Android/iOS
      - name: Init Mobile Targets
        if: matrix.target == 'android' || matrix.target == 'ios'
        run: npx tauri ${{ matrix.target }} init

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        with:
          tagName: v__VERSION__
          releaseName: 'my-ide v__VERSION__'
          releaseBody: 'Автоматична збірка для Desktop (Windows, Linux, macOS) та Mobile (Android APK, iOS).'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}