name: 'Publish Cross-Platform Release'

on:
  push:
    tags:
      - 'v*' # Спрацьовує при створенні тегів типу v1.0.0, v0.1.0 тощо

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # Складання під macOS (x86_64 та Apple Silicon)
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04' # Складання під Linux (.deb, .AppImage)
            args: ''
          - platform: 'windows-latest' # Складання під Windows (.msi, .exe)
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # Автоматично підставить версію з package.json
          releaseName: 'my-ide v__VERSION__'
          releaseBody: 'Дивіться примітки до релізу для детальної інформації.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}