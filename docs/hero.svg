<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="neon" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="350" rx="12" fill="url(#bg)" />
  <rect x="1" y="1" width="798" height="348" rx="12" fill="none" stroke="#334155" stroke-width="2" opacity="0.6" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <path d="M0 50 H800 M0 100 H800 M0 150 H800 M0 200 H800 M0 250 H800 M0 300 H800" />
    <path d="M100 0 V350 M200 0 V350 M300 0 V350 M400 0 V350 M500 0 V350 M600 0 V350 M700 0 V350" />
  </g>

  <!-- Animated Radio Signal Wave -->
  <g transform="translate(0, 40)">
    <path d="M 0 100 Q 100 20, 200 100 T 400 100 T 600 100 T 800 100" fill="none" stroke="url(#glow)" stroke-width="4" filter="url(#neon)" opacity="0.3">
      <animate attributeName="d" dur="6s" repeatCount="indefinite"
        values="M 0 100 Q 100 20, 200 100 T 400 100 T 600 100 T 800 100;
                M 0 100 Q 100 180, 200 100 T 400 100 T 600 100 T 800 100;
                M 0 100 Q 100 20, 200 100 T 400 100 T 600 100 T 800 100" />
    </path>
    <path d="M 0 100 Q 150 160, 300 100 T 600 100 T 800 100" fill="none" stroke="#38bdf8" stroke-width="3" filter="url(#neon)">
      <animate attributeName="d" dur="4s" repeatCount="indefinite"
        values="M 0 100 Q 150 40, 300 100 T 600 100 T 800 100;
                M 0 100 Q 150 160, 300 100 T 600 100 T 800 100;
                M 0 100 Q 150 40, 300 100 T 600 100 T 800 100" />
    </path>
  </g>

  <!-- Title & Subtitle -->
  <text x="60" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#f8fafc" letter-spacing="1.5">
    SIGNAL &amp; RADIO IDE
  </text>
  
  <text x="60" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#38bdf8" letter-spacing="2">
    RUST + TAURI v2 + SVELTEKIT
  </text>

  <!-- Badges / Tech Stack Pills -->
  <g transform="translate(60, 230)">
    <!-- Windows/Linux/Mac Badge -->
    <rect x="0" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="12" y="20" font-family="monospace" font-size="12" fill="#e2e8f0">🖥️ Desktop Ready</text>

    <!-- Parser Badge -->
    <rect x="155" y="0" width="145" height="30" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="167" y="20" font-family="monospace" font-size="12" fill="#38bdf8">⚡ #graph &amp; #adif</text>

    <!-- CI/CD Status Pulse -->
    <rect x="310" y="0" width="135" height="30" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1" />
    <circle cx="325" cy="15" r="5" fill="#22c55e">
      <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="340" y="20" font-family="monospace" font-size="12" fill="#4ade80">CI/CD Passing</text>
  </g>

  <!-- Decorative Code Bracket -->
  <text x="700" y="165" font-family="monospace" font-size="90" font-weight="bold" fill="#334155" opacity="0.3">
    &gt;_
  </text>
</svg>
